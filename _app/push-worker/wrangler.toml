name = "monaccompagnateur-push"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Adresses du Worker : api.monaccompagnateur.ca (domaine géré chez Cloudflare), et l'ancienne adresse
# monaccompagnateur-push.monaccompagnateur.workers.dev, gardée active pour les téléphones pas encore à jour.
workers_dev = true
routes = [{ pattern = "api.monaccompagnateur.ca", custom_domain = true }]

# Vérifie chaque minute les annonces à envoyer
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "monaccompagnateur-push"
database_id = "fe8618b4-e283-4e83-b9de-ed2235358117"

[vars]
# Sites autorisés à abonner un téléphone et à appeler l'API (séparés par des virgules)
ALLOWED_ORIGINS = "https://monaccompagnateur.ca"
# Contact VAPID transmis à Apple et Google (une URL https: ou une adresse mailto:)
VAPID_SUBJECT = "https://monaccompagnateur.ca"
# Envois par passage du cron (le forfait gratuit permet 50 requêtes sortantes par passage)
MAX_PUSH_PER_RUN = "40"
# Délai minimal entre la publication et l'envoi, le temps que GitHub Pages mette le site à jour
PUBLISH_DELAY_SECONDS = "180"
# Une annonce nouvelle plus vieille que ça n'est pas envoyée (évite de renvoyer l'historique)
MAX_PAST_SECONDS = "900"
# Durée pendant laquelle Apple / Google gardent un message pour un téléphone sans réseau
PUSH_TTL_SECONDS = "43200"
# Effacement automatique des abonnements N jours après la fin du voyage
PURGE_AFTER_DAYS = "7"
# Publication depuis l'éditeur : dépôt et branche du site (le jeton est le secret GITHUB_TOKEN)
GITHUB_REPO = "Matlavigne/matlavigne.github.io"
GITHUB_BRANCH = "main"

# Voyages : créés dans monaccompagnateur.ca/admin et gardés dans la base D1. Sölden 2027, créé avant
# l'administration, est encore décrit ici (end : date de retour; les abonnements sont effacés 7 jours après).
[vars.TRIPS.solden-voyage-2027]
title = "Sölden 2027"
url = "/solden-voyage-2027/"
end = "2027-03-13"
maxSubs = 300

# Secrets (jamais dans ce fichier) :
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK : notifications (npm run setup, une seule fois)
#   GITHUB_TOKEN : jeton GitHub « fine-grained », dépôt du site seulement, Contents : Read and write
#   ADMIN_TOKEN : clé de première configuration (npm run cle-config)
# L'ancien secret EDITOR_TOKENS ne sert plus : npx wrangler secret delete EDITOR_TOKENS
